version: '3.8'

services:
  black-beacon-ctf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operation-black-beacon
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
